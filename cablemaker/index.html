<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CableMaker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231e2127'/%3E%3Cpath d='M3 5h2v6H3zM11 5h2v6h-2z' fill='%23d6dae0'/%3E%3Cpath d='M5 6.5h6M5 9.5h6' stroke='%234a9eff' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="toolbar" class="toolbar" role="toolbar" aria-label="Main toolbar"></header>

  <main id="workspace">
    <div id="canvas-host" tabindex="0">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <aside id="inspector" aria-label="Properties"></aside>
  </main>

  <footer id="statusbar">
    <span id="status-hint">Ready</span>
    <span id="status-coords"></span>
    <span id="status-zoom"></span>
  </footer>
</div>

<div id="overlay-layer"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
